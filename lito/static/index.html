<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lito — thinking agent</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Lito</h1>
      <p class="tag">lightest thinking AI · tiny RAM · tools + multi-step reasoner</p>
    </header>
    <div id="log" class="log" aria-live="polite"></div>
    <form id="f" class="bar">
      <input id="q" type="text" autocomplete="off" placeholder="Ask anything — I'll think, then act…" autofocus />
      <button type="submit">Send</button>
    </form>
    <div class="chips">
      <button type="button" data-q="help">help</button>
      <button type="button" data-q="what is photosynthesis">think: photosynthesis</button>
      <button type="button" data-q="calculate 2^16 - 1">calc</button>
      <button type="button" data-q="sysinfo">sysinfo</button>
      <button type="button" data-q="search web MQTT QoS">web search</button>
      <button type="button" data-q="remember project is lito">remember</button>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
