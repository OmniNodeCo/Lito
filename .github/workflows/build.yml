name: Build SmartAI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Run feature tests (dictionary, NLP, search parsing)
        run: python tests/test_features.py

      - name: Run training from scratch
        run: |
          python train.py --epochs 15 --batch_size 4 --seq_len 32 --d_model 64 --n_layers 2 --n_heads 2 --d_ff 256 --save_dir checkpoints

      - name: Package model files
        run: |
          cd checkpoints
          zip -r ../model.zip best_model.npz tokenizer.json
          cd ..

      - name: Test chat inference
        run: |
          python -c "
          from src.brain import AIBrain
          brain = AIBrain(model_dir='checkpoints')
          brain.initialize()
          assert brain.loaded, 'Model failed to load!'
          response = brain.think('What is machine learning?')
          print(f'AI Response: {response}')
          "

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: model.zip
          retention-days: 30

      - name: Update latest-model release (On Main/Master)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-model
          name: "SmartAI Latest Model"
          body: "Automated build of the latest trained weights and tokenizer."
          files: model.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-executables:
    needs: train-and-package
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: SmartAI-Windows
            binary_name: SmartAI.exe
          - os: ubuntu-latest
            artifact_name: SmartAI-Linux
            binary_name: SmartAI
          - os: macos-latest
            artifact_name: SmartAI-macOS
            binary_name: SmartAI
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyinstaller

      - name: Download trained model artifact
        uses: actions/download-artifact@v4
        with:
          name: trained-model

      - name: Extract model
        run: |
          python -c "
          import zipfile, os
          os.makedirs('checkpoints', exist_ok=True)
          with zipfile.ZipFile('model.zip', 'r') as z:
              z.extractall('checkpoints')
          "

      - name: Build executable with PyInstaller
        run: python build.py

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.binary_name }}
          retention-days: 90