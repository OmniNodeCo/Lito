name: Build Lito

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Run feature tests (dictionary, NLP, search parsing)
        run: python tests/test_features.py

      - name: Run training from scratch
        run: |
          python train.py --epochs 15 --batch_size 4 --seq_len 32 --d_model 64 --n_layers 2 --n_heads 2 --d_ff 256 --save_dir checkpoints

      - name: Package model files
        run: |
          cd checkpoints
          zip -r ../model.zip best_model.npz tokenizer.json
          cd ..

      - name: Test chat inference
        run: |
          python -c "
          from src.brain import AIBrain
          brain = AIBrain(model_dir='checkpoints')
          brain.initialize()
          assert brain.loaded, 'Model failed to load!'
          response = brain.think('What is machine learning?')
          print(f'AI Response: {response}')
          "

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: model.zip
          retention-days: 30

      - name: Update latest-model release (On Main/Master)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-model
          name: "Lito Latest Model"
          body: "Automated build of the latest trained weights and tokenizer."
          files: model.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-desktop:
    name: Build desktop app (Go)
    needs: train-and-package        # the desktop bundles ship the trained model
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download trained model artifact
        uses: actions/download-artifact@v4
        with:
          name: trained-model

      - name: Extract model
        run: |
          mkdir -p checkpoints
          cd checkpoints
          unzip -o ../model.zip

      - name: Vet and build (all platforms)
        run: |
          cd desktop
          go vet ./...
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../dist/LitoDesktop-Windows.exe .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../dist/LitoDesktop-Linux .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../dist/LitoDesktop-macOS-intel .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../dist/LitoDesktop-macOS-apple .

      - name: Bundle the AI engine with each binary
        run: |
          cat > dist/README-DESKTOP.txt <<'EOF'
          Lito - desktop app
          ==================
          The GUI is the Go app; the thinking happens in Python.

          Run it:
            Windows: double-click LitoDesktop-Windows.exe - a browser
                     window opens. The app has no console; if anything
                     goes wrong see lito-desktop.log next to the exe.
            Linux:   ./LitoDesktop-Linux
            macOS:   ./LitoDesktop-macOS-* (unsigned: right-click -> Open,
                     or: xattr -d com.apple.quarantine LitoDesktop-macOS-*)

          Requirements: Python 3.8+ with numpy on your PATH
          (pip install numpy). The app starts the AI engine (server.py)
          by itself and restarts it if it crashes. If the banner says the
          engine is missing, install Python - no restart needed.

          Without the Go app the same UI runs from Python alone:
            python server.py            # http://127.0.0.1:5486
          Terminal chat:  python main.py
          Training:       python train.py --help
          EOF
          for name in Windows Linux macOS-intel macOS-apple; do
            bin="dist/LitoDesktop-$name"
            if [ "$name" = "Windows" ]; then bin="$bin.exe"; fi
            test -f "$bin" || { echo "::error::missing $bin"; exit 1; }
            rm -rf bundle/Lito && mkdir -p bundle/Lito
            cp "$bin" bundle/Lito/
            cp server.py main.py train.py dist/README-DESKTOP.txt bundle/Lito/
            cp -r src extensions data checkpoints bundle/Lito/
            rm -rf bundle/Lito/data/cache
            (cd bundle && zip -qr "../dist/LitoDesktop-$name.zip" Lito)
          done
          ls -la dist

      - name: Upload desktop app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lito-desktop
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 90

  build-executables:
    needs: train-and-package
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: Lito-Windows
            binary_name: Lito.exe
          - os: ubuntu-latest
            artifact_name: Lito-Linux
            binary_name: Lito
          - os: macos-latest
            artifact_name: Lito-macOS
            binary_name: Lito
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyinstaller

      - name: Download trained model artifact
        uses: actions/download-artifact@v4
        with:
          name: trained-model

      - name: Extract model
        run: |
          python -c "
          import zipfile, os
          os.makedirs('checkpoints', exist_ok=True)
          with zipfile.ZipFile('model.zip', 'r') as z:
              z.extractall('checkpoints')
          "

      - name: Build executables with PyInstaller
        run: python build.py

      - name: Check built binaries
        shell: bash
        run: |
          ls -la dist
          test -f "dist/${{ matrix.binary_name }}" || { echo "::error::missing dist/${{ matrix.binary_name }}"; exit 1; }

      - name: Upload Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist
          if-no-files-found: error
          retention-days: 90