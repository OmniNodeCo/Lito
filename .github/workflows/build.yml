name: Build

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show environment
        shell: bash
        run: |
          python -c "import sys,platform; print(sys.version); print(platform.platform())"

      - name: Unit tests
        env:
          LITO_DATA: ${{ runner.temp }}/lito-test-data
          LITO_FORCE_LOCAL: "1"
          LITO_SHOW_THOUGHTS: "1"
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -u -m unittest discover -s tests -v

      - name: One-shot CLI smoke
        shell: bash
        env:
          LITO_DATA: ${{ runner.temp }}/lito-smoke-data
          LITO_FORCE_LOCAL: "1"
          LITO_SHOW_THOUGHTS: "0"
        run: |
          python run_lito.py -c "help"
          python run_lito.py -c "sysinfo"
          python run_lito.py -c "calculate 6*7"
          python run_lito.py -c "time"
          python run_lito.py --version

  build-exe:
    name: Executable (${{ matrix.plat }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            plat: linux-x86_64
          - os: macos-latest
            plat: macos-arm64
          - os: windows-latest
            plat: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build deps
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build executable
        shell: bash
        run: |
          pyinstaller lito.spec
          ls -la dist || dir dist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lito-${{ matrix.plat }}
          path: |
            dist/lito-*
            dist/lito-*.exe
          if-no-files-found: warn
