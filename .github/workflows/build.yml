name: Build Lito

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Run feature tests (dictionary, NLP, search parsing)
        run: python tests/test_features.py

      - name: Run training from scratch
        run: |
          python train.py --epochs 15 --batch_size 4 --seq_len 32 --d_model 64 --n_layers 2 --n_heads 2 --d_ff 256 --save_dir checkpoints

      - name: Package model files
        run: |
          cd checkpoints
          zip -r ../model.zip best_model.npz tokenizer.json
          cd ..

      - name: Test chat inference
        run: |
          python -c "
          from src.brain import AIBrain
          brain = AIBrain(model_dir='checkpoints')
          brain.initialize()
          assert brain.loaded, 'Model failed to load!'
          response = brain.think('What is machine learning?')
          print(f'AI Response: {response}')
          "

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: model.zip
          retention-days: 30

      - name: Update latest-model release (On Main/Master)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-model
          name: "Lito Latest Model"
          body: "Automated build of the latest trained weights and tokenizer."
          files: model.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One runner per platform builds everything users download:
  # the Go desktop app, the frozen LitoEngine (Python + numpy + data +
  # model included, so the desktop bundles need no Python installed) and
  # the PyInstaller console chat app - then assembles the LitoDesktop
  # bundle zip for that platform.
  build-apps:
    name: Build apps (${{ matrix.platform }})
    needs: train-and-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            exe: .exe
            console: Lito.exe
            console_artifact: Lito-Windows
            desktop_artifact: desktop-Windows
            go_ldflags: "-s -w -H=windowsgui"
          - os: ubuntu-latest
            platform: Linux
            exe: ""
            console: Lito
            console_artifact: Lito-Linux
            desktop_artifact: desktop-Linux
            go_ldflags: "-s -w"
          - os: macos-latest
            platform: macOS-apple
            exe: ""
            console: Lito
            console_artifact: Lito-macOS
            desktop_artifact: desktop-macOS-apple
            go_ldflags: "-s -w"
          - os: macos-13
            platform: macOS-intel
            exe: ""
            console: Lito
            console_artifact: Lito-macOS-intel
            desktop_artifact: desktop-macOS-intel
            go_ldflags: "-s -w"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyinstaller

      - name: Download trained model artifact
        uses: actions/download-artifact@v4
        with:
          name: trained-model

      - name: Extract model
        shell: bash
        run: |
          mkdir -p checkpoints
          cd checkpoints
          unzip -o ../model.zip

      - name: Build executables with PyInstaller (console app + frozen AI engine)
        run: python build.py

      - name: Check built executables
        shell: bash
        run: |
          ls -la dist
          test -f "dist/${{ matrix.console }}" || { echo "::error::missing dist/${{ matrix.console }}"; exit 1; }
          test -f "dist/LitoEngine/LitoEngine${{ matrix.exe }}" \
            || { echo "::error::missing frozen engine dist/LitoEngine/LitoEngine${{ matrix.exe }}"; exit 1; }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Vet and build the desktop app
        shell: bash
        run: |
          cd desktop
          go vet ./...
          mkdir -p ../dist
          go build -trimpath -ldflags "${{ matrix.go_ldflags }}" -o "../dist/LitoDesktop-${{ matrix.platform }}${{ matrix.exe }}" .

      - name: Assemble the LitoDesktop bundle
        shell: bash
        run: |
          cat > dist/README-DESKTOP.txt <<'EOF'
          Lito - desktop app
          ==================
          The GUI is the Go app; the thinking happens in LitoEngine, a
          self-contained AI engine (Python + numpy + the trained model are
          all included). Nothing to install - just run it.

          Run it:
            Windows: double-click LitoDesktop-Windows.exe - a browser
                     window opens. The app has no console; if anything
                     goes wrong see lito-desktop.log next to the exe.
            Linux:   ./LitoDesktop-Linux
            macOS:   ./LitoDesktop-macOS-* (unsigned: right-click -> Open,
                     or: xattr -d com.apple.quarantine LitoDesktop-macOS-*)

          The desktop app starts LitoEngine automatically and restarts it
          if it crashes. If the banner says the engine is missing, keep
          LitoDesktop and LitoEngine in the same folder.

          Without the Go app the same UI runs from the engine alone:
            LitoEngine/LitoEngine            # http://127.0.0.1:5486
          Terminal chat (needs no engine): ./Lito
          Training: click "Train" in the app (the engine re-runs itself).
          EOF
          rm -rf bundle/Lito && mkdir -p bundle/Lito
          cp "dist/LitoDesktop-${{ matrix.platform }}${{ matrix.exe }}" bundle/Lito/
          cp -r dist/LitoEngine bundle/Lito/
          cp dist/README-DESKTOP.txt bundle/Lito/
          python -c "import shutil; shutil.make_archive('dist/LitoDesktop-${{ matrix.platform }}', 'zip', 'bundle')"
          ls -la dist

      - name: Upload console chat app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.console_artifact }}
          path: dist/${{ matrix.console }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.desktop_artifact }}
          path: dist/LitoDesktop-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 90
