name: Build LitoBot Executable

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-learn joblib pyinstaller

      - name: Train ML Model
        run: |
          python train.py

      - name: Build Executable
        run: |
          python setup.py

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LitoBot-Windows-x64
          path: dist/LitoBot.exe
          if-no-files-found: error
