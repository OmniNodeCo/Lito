name: Build SmartAI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  train-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Run training
        run: |
          python train.py --epochs 10 --batch_size 4 --seq_len 32 --d_model 64 --n_layers 2 --n_heads 2 --d_ff 256

      - name: Test chat interface
        run: |
          python -c "
          from src.brain import AIBrain
          brain = AIBrain(model_dir='checkpoints')
          brain.initialize()
          response = brain.think('Hello, who are you?')
          print(f'Response: {response}')
          assert len(response) > 0, 'Empty response!'
          print('Test passed!')
          "

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: checkpoints/
          retention-days: 30

  build-windows:
    needs: train-and-test
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyinstaller

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: checkpoints/

      - name: Build executable
        run: python build.py

      - name: Test executable exists
        run: |
          if (Test-Path "dist/SmartAI.exe") {
            Write-Host "Build successful! SmartAI.exe created."
            Get-Item "dist/SmartAI.exe" | Select-Object Name, Length
          } else {
            Write-Host "Build failed - executable not found"
            exit 1
          }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: SmartAI-Windows
          path: dist/SmartAI.exe
          retention-days: 90

  build-linux:
    needs: train-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyinstaller

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: checkpoints/

      - name: Build executable
        run: python build.py

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: SmartAI-Linux
          path: dist/SmartAI
          retention-days: 90

  build-macos:
    needs: train-and-test
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pyinstaller

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: checkpoints/

      - name: Build executable
        run: python build.py

      - name: Upload macOS executable
        uses: actions/upload-artifact@v4
        with:
          name: SmartAI-macOS
          path: dist/SmartAI
          retention-days: 90

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            SmartAI-Windows/SmartAI.exe
            SmartAI-Linux/SmartAI
            SmartAI-macOS/SmartAI
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}