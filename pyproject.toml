[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lito"
version = "0.3.0"
description = "Lightest thinking AI — custom micro-LLM (Lito-Nano) + tools, tiny RAM, stdlib only"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Lito" }]
keywords = ["assistant", "agent", "ai", "low-memory", "reasoning"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Zero third-party runtime dependencies — stdlib only.
dependencies = []

[project.scripts]
lito = "lito.__main__:main"

[project.optional-dependencies]
dev = []
build = ["pyinstaller>=6.0", "build"]

[tool.setuptools.packages.find]
include = ["lito*"]

[tool.setuptools.package-data]
lito = ["static/*", "nano/weights/*"]
