# Lito Build Configuration
# ===========================

# Default application name (fallback for targets without their own name)
name: Lito

# Build as single executable
onefile: true

# Icon file (optional, .ico for Windows)
# icon: assets/icon.ico

# Additional data directories to include (shared by all targets)
extra_data: [checkpoints, src, data, extensions]

# Hidden imports that PyInstaller might miss (shared by all targets)
hidden_imports: [numpy, json, re, os, sys, time, argparse]

# Build targets (the app is the UI: the Go desktop app + the frozen
# engine below; the old terminal chat app was removed in v1.2.5):
#   name             output name (dist/<name>)
#   entry_point       script to freeze
#   console          true = terminal app
#   onefile          false = a folder (exe + _internal/) - used by the
#                    engine so learned words, caches and trained models
#                    persist next to it instead of a temp dir
#   extra_data       per-target override of the shared data dirs
#
# The desktop app is the Go app (desktop/); LitoEngine is the AI engine
# frozen with its own Python + numpy, so the LitoDesktop release bundles
# need no Python installed.
targets:
  - name: LitoEngine
    entry_point: server.py
    console: true
    onefile: false
    extra_data: [checkpoints, src, data, extensions, desktop/ui]

# Platform-specific settings
# windows:
#   uac_admin: false
#   version_file: version.txt

# Optimization
# strip: true
# upx: true

# Go desktop app (desktop/) - NOT built by PyInstaller. CI cross-compiles
# it in the build-desktop job (see .github/workflows/build.yml); locally:
#   cd desktop && go build
#
# Build output directory
dist_dir: dist
build_dir: build_temp

# Training configuration (used by CI/CD)
training:
  epochs: 30
  batch_size: 4
  seq_len: 64
  d_model: 128
  n_layers: 4
  n_heads: 4
  d_ff: 512
  vocab_size: 2048
  learning_rate: 0.0003
